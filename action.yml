name: "Articulate"
description: "Writing-quality and AI-tell checks with SARIF output for inline PR annotations."
branding:
  icon: "edit-3"
  color: "green"
inputs:
  files:
    description: "Files or globs to check (space-separated)."
    required: false
    default: "**/*.md"
  profile:
    description: "Force a register profile (optional)."
    required: false
    default: ""
  python-version:
    description: "Python version to run under."
    required: false
    default: "3.12"
  audit-path:
    description: "Directory of committed receipts to re-verify; fails the build on any drift."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    # Installs the checked-out package. Swap for `pip install articulate-writing`
    # once the package is published to PyPI.
    - run: pip install "${{ github.action_path }}"
      shell: bash
    - run: |
        PROFILE=""
        if [ -n "${{ inputs.profile }}" ]; then PROFILE="--profile ${{ inputs.profile }}"; fi
        python -m articulate.cli check ${{ inputs.files }} $PROFILE --sarif > articulate.sarif
      shell: bash
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: articulate.sarif
        category: articulate
    # Optional: re-verify committed receipts still hold against their source, and
    # fail the build on any drift. Wire a receipts directory via the audit-path input.
    - run: |
        if [ -n "${{ inputs.audit-path }}" ]; then
          python -m articulate.cli audit "${{ inputs.audit-path }}" --reverify --gate
        fi
      shell: bash
