[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "articulate-writing"
version = "0.8.0"
description = "Local, re-derivable writing-quality and AI-tell detection and editing: register profiles, writing modes, a genre axis, and content-free audit receipts."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zain Dana Harper" }]
keywords = ["writing", "linter", "prose", "ai-detection", "editor", "quality", "receipt", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Environment :: Console",
    "Intended Audience :: Developers",
]
dependencies = []  # the core detector is standard-library only

[project.optional-dependencies]
mcp = ["fastmcp>=3"]      # the MCP server surface
hosted = ["fastmcp>=3.2.4,<4", "pydantic>=2.12,<3", "uvicorn>=0.30,<1"]  # opt-in authenticated HTTP
dev = ["pytest>=7"]

[project.scripts]
articulate = "articulate.cli:main"
articulate-lsp = "articulate.lsp_server:serve"
# The stdlib-only stdio MCP server. It needs nothing beyond the base install, so
# an MCP host can launch it straight from `pip install articulate-writing`. The
# fastmcp server stays available under the [mcp] extra as articulate.mcp_server.
articulate-mcp = "articulate.local_mcp:main"
# The advisory PostToolUse check for agent harnesses (Claude Code, Codex and any
# client that runs a command hook with the same event shape). Standard library only.
articulate-edit-hook = "articulate.edit_hook:main"
# The house-voice hook: the brief at SessionStart, and the optional revise-mode
# Stop check. Standard library only.
articulate-house-hook = "articulate.house_hook:main"

[project.urls]
Homepage = "https://github.com/HarperZ9/articulate"
Repository = "https://github.com/HarperZ9/articulate"
Documentation = "https://github.com/HarperZ9/articulate/tree/main/docs"
Issues = "https://github.com/HarperZ9/articulate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/articulate"]
