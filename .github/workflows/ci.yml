name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # The suite gates on the benchmark (recall/specificity), the dogfood check
      # (our own prose passes our own standard), the mode/receipt/LSP contracts,
      # and the ReDoS safety test.
      - run: python -m pytest -q

  # The claude CLI tests start stand-in .cmd and .bat shims through cmd.exe and
  # check the Windows resolution order. Those tests skip on Linux, so they need
  # a Windows runner. 3.9 and 3.12 bracket the supported range.
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  # The Claude plugin starts its server with python3, and macOS is the third
  # system it supports. These are the plugin tests; the smoke run starts a built
  # plugin with the stock python3 the command line tools install.
  test-macos-plugin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: >-
          python -m pytest -q tests/test_tool_annotations.py
          tests/test_claude_plugin_bundle.py tests/test_claude_plugin_launch.py
          tests/test_local_mcp_plugin_surface.py tests/test_local_tools_stay_local.py
          tests/test_claude_plugin_claims.py tests/test_claude_plugin_scripts.py
          tests/test_claude_plugin_audit.py
      - run: python scripts/build_claude_plugin.py build/claude-plugin --dev
      - run: /usr/bin/python3 scripts/smoke_claude_plugin.py build/claude-plugin --command /usr/bin/python3

  articulate-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Dogfood in CI: our shipped docs must pass our own gate.
      - run: python -m articulate.cli check README.md CHANGELOG.md docs/*.md --gate

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
