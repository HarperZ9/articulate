name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # The suite gates on the benchmark (recall/specificity), the dogfood check
      # (our own prose passes our own standard), the mode/receipt/LSP contracts,
      # and the ReDoS safety test.
      - run: python -m pytest -q

  # The claude CLI tests start stand-in .cmd and .bat shims through cmd.exe and
  # check the Windows resolution order. Those tests skip on Linux, so they need
  # a Windows runner. 3.9 and 3.12 bracket the supported range.
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  articulate-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Dogfood in CI: our shipped docs must pass our own gate under the house
      # profile, the style this project chose. No path rule selects it for anyone.
      - run: python -m articulate.cli check README.md CHANGELOG.md docs/*.md --gate --profile house

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
