name: Publish to PyPI

# Publishes the package when a GitHub Release is published, or on a manual run.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repository.
# One-time setup on PyPI: add a pending publisher for project "articulate-writing"
# pointing at this repository, the workflow file "publish.yml", and the environment
# "pypi". See https://docs.pypi.org/trusted-publishers/.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
