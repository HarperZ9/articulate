name: Publish to PyPI

# Publishes the package when a GitHub Release is published, or on a manual run.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repository.
#
# The filename is load-bearing. PyPI's trusted publisher for "articulate-writing"
# names this repository, the workflow file "publish.yml", and the environment
# "pypi". Renaming this file breaks publishing until the publisher is updated to
# match. See https://docs.pypi.org/trusted-publishers/.
#
# Actions are pinned by commit SHA, not by tag. A tag can be moved to point at
# different code, which makes tag-pinning a supply-chain hole in a workflow that
# holds publishing authority.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: the release tag must match the declared version
        if: github.event_name == 'release'
        run: |
          PKG_VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG_VER" ] && [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "tag $TAG_VER does not match pyproject $PKG_VER"; exit 1
          fi
          echo "version gate: tag $TAG_VER == pyproject $PKG_VER"

      - name: artifact digests, recorded in the run log
        run: |
          python - <<'EOF'
          import hashlib, pathlib
          for p in sorted(pathlib.Path("dist").iterdir()):
              print(f"sha256  {hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          EOF

      # Installs the wheel into a clean venv and resolves EVERY declared console
      # script to a real callable. Stronger than `--version`: a package whose
      # entry point names a missing function installs fine and fails at first
      # use. That is not hypothetical here. articulate-mcp exists because the
      # fastmcp MCP entry did exactly that, raising ModuleNotFoundError at
      # launch because its dependency lives in an extra.
      - name: no broken release, resolve every entry point
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install "$(echo dist/*.whl)"
          /tmp/smoke/bin/python - <<'EOF'
          from importlib.metadata import distribution
          d = distribution("articulate-writing")
          eps = [e for e in d.entry_points if e.group == "console_scripts"]
          for e in eps:
              fn = e.load()
              assert callable(fn), f"{e.name} -> {e.value} is not callable"
              print(f"entry point ok: {e.name} -> {e.value}")
          print(f"articulate-writing {d.version}: {len(eps)} entry point(s) resolved")
          EOF

      # The MCP server must answer from a bare install, with no extras. This is
      # the regression that motivated 0.4.0, so it is checked end to end rather
      # than trusted to a unit test.
      - name: the stdio MCP server answers from a bare install
        run: |
          /tmp/smoke/bin/python - <<'EOF'
          import json, subprocess, sys
          req = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                            "params": {"protocolVersion": "2024-11-05",
                                       "capabilities": {},
                                       "clientInfo": {"name": "ci", "version": "1"}}})
          listing = json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/list",
                                "params": {}})
          p = subprocess.run(["/tmp/smoke/bin/articulate-mcp"],
                             input=(req + "\n" + listing + "\n").encode(),
                             capture_output=True, timeout=120)
          lines = [l for l in p.stdout.decode().splitlines() if l.strip().startswith("{")]
          assert lines, f"no response. rc={p.returncode} stderr={p.stderr.decode()[:400]}"
          info = tools = None
          for l in lines:
              r = json.loads(l).get("result", {})
              info = r.get("serverInfo", info)
              tools = r.get("tools", tools)
          assert info, "no serverInfo in the initialize response"
          assert tools, "tools/list returned nothing"
          print(f"stdio MCP ok: {info['name']} {info['version']}, {len(tools)} tools")
          EOF

      - name: the sdist must build a wheel too
        run: |
          python -m venv /tmp/sd
          /tmp/sd/bin/pip install --upgrade pip build
          /tmp/sd/bin/python -m build --wheel --outdir /tmp/sdout "$(echo dist/*.tar.gz)"
          ls -l /tmp/sdout

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Stays skipped until the repository variable PYPI_ENABLED is 'true', so a
    # release can be cut and fully gated without an upload attempt behind it.
    if: ${{ vars.PYPI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC. No token, no secret.
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations: the index records who built these bytes and
          # from which workflow, verifiable without trusting us.
          attestations: true
