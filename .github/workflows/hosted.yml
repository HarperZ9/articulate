name: Hosted MCP acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hosted-http:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,hosted]" httpx
      # Fail before collection if the optional transport dependencies are absent.
      - run: python -c "import fastmcp, httpx, uvicorn; from starlette.testclient import TestClient"
      - run: python -m pytest tests/test_hosted_mcp.py -q
